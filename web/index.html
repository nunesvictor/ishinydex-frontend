<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Substituído pelo valor de `--base-href` no `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Keep track of your shiny PersonalDex with iShinyDex.">
  <!-- Cor da barra de status/do navegador: a do AppBar de cada tema
       (colorScheme.surface do AppTheme; conferida em test/web_index_test.dart).
       O app troca a cor quando o sistema muda de modo (Title em app.dart). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131313">
  <style>
    body { background-color: #FAFAFA; }
    @media (prefers-color-scheme: dark) { body { background-color: #131313; } }

    /* Splash do primeiro carregamento (#159). Antes do primeiro quadro o
       navegador baixa o app (main.dart.wasm, motor, catálogo) e a tela fica
       vazia. O splash já vem na página, mas invisível: só aparece se o
       carregamento passar da margem de tolerância (o atraso da animação
       splash-in). Quem abre rápido (o normal, pelo cache do service worker)
       nunca o vê. Some no primeiro quadro do Flutter (script no fim do
       body). Cores do AppTheme, conferidas em test/web_index_test.dart. */
    #splash {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px;
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      color: #1C1B1B; opacity: 0;
      animation: splash-in 200ms ease 450ms forwards;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash span { font-size: 22px; font-weight: 500; }
    /* Barra indeterminada: o loader não diz quanto falta. */
    .splash-track {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      margin-top: 8px; background: #FFDAD6;
    }
    .splash-bar {
      width: 40%; height: 100%; border-radius: 2px; background: #C62828;
      animation: splash-bar 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      #splash { color: #E6E1E1; }
      .splash-track { background: #8C1D18; }
      .splash-bar { background: #FF8A80; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-bar { width: 100%; animation: none; opacity: 0.6; }
    }
    /* Saída de segurança (#176): sem o primeiro quadro em 15 s, o boot
       travou (um download pendurado, por exemplo); o splash explica e
       oferece recarregar. */
    .splash-slow { display: none; flex-direction: column; align-items: center;
      gap: 12px; margin-top: 8px; font-size: 14px; color: #4A4646; }
    #splash .splash-slow span { font-size: 14px; font-weight: 400; }
    #splash.slow { pointer-events: auto; }
    #splash.slow .splash-slow { display: flex; }
    .splash-slow button {
      font: inherit; font-weight: 500; border: 0; border-radius: 20px;
      padding: 10px 24px; background: #C62828; color: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      .splash-slow { color: #CAC4C4; }
      .splash-slow button { background: #FF8A80; color: #5F0010; }
    }
    @keyframes splash-in { to { opacity: 1; } }
    @keyframes splash-bar {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
  </style>

  <!-- PWA no iOS: abrir em tela cheia a partir da tela de início. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default": o iOS pinta a barra com o theme-color e escolhe o texto
       que contrasta (escuro no claro, branco no escuro). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iShinyDex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iShinyDex</title>
  <link rel="manifest" href="manifest.json">
  <!-- Idioma do shell (#178): o que vem antes do app (este HTML, o splash,
       o manifesto) segue o do app. Primeiro o escolhido em Ajustes (o
       shared_preferences guarda em localStorage, "flutter.app_language"); em
       Automático, o do navegador, como o resolveLocale do app: qualquer
       português vira pt-BR, o resto fica em inglês (o padrão desta página). -->
  <script>
    window.ishinydexLang = (() => {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem('flutter.app_language'));
      } catch (_) {}
      if (saved === 'pt' || saved === 'en') return saved;
      const langs = navigator.languages?.length
        ? navigator.languages
        : [navigator.language || ''];
      return langs.some((l) => l.toLowerCase().startsWith('pt')) ? 'pt' : 'en';
    })();
    if (window.ishinydexLang === 'pt') {
      document.documentElement.lang = 'pt-BR';
      document.querySelector('meta[name="description"]').content =
        'Controle do PersonalDex do iShinyDex.';
      document.querySelector('link[rel="manifest"]').href = 'manifest.pt-BR.json';
    }
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <span>iShinyDex</span>
    <div class="splash-track"><div class="splash-bar"></div></div>
    <div class="splash-slow">
      <span data-pt="Está demorando mais que o normal.">It's taking longer than usual.</span>
      <button type="button" onclick="location.reload()" data-pt="Recarregar">Reload</button>
    </div>
  </div>
  <!-- Cache offline (web/sw.js): depois de um uso online, o app abre sem
       internet. Relativo ao <base href>, então vale no Pages e no Docker.
       Registrado só depois do primeiro quadro (#176): numa atualização, o
       worker novo assume a página (skipWaiting/clients.claim) e, durante o
       boot, isso pode derrubar downloads em andamento no iOS (o app ficou
       parado no splash na primeira abertura da v2.5.0). Depois do primeiro
       quadro, a troca não atrapalha. -->
  <script>
    // O worker novo de uma versão nova espera (#228): o navegador o instala
    // sozinho ao abrir a página, mas ele só assume quando a página pede,
    // depois do primeiro quadro.
    //
    // Versão nova com o app aberto (#228): a página procura um sw.js novo ao
    // voltar ao app e a cada 30 minutos. Quando o worker novo assume, ela
    // pergunta a versão dele; se não for a desta página (o código Dart que
    // está rodando), avisa o app (evento "ishinydex-update-ready"), que
    // oferece recarregar. Na abertura, a página já é a versão nova (veio da
    // rede): a troca de worker não gera aviso.
    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      const sw = navigator.serviceWorker;
      const skip = (worker) => worker && worker.postMessage('skip-waiting');
      sw.addEventListener('controllerchange', () => {
        sw.controller?.postMessage('version');
      });
      sw.addEventListener('message', (event) => {
        const page = typeof buildVersion === 'string' ? buildVersion : '';
        if (event.data?.type !== 'version' || page.startsWith('__')) return;
        if (event.data.version === page) return;
        window.ishinydexUpdateReady = true;
        window.dispatchEvent(new Event('ishinydex-update-ready'));
      });
      sw.register('sw.js').then((registration) => {
        skip(registration.waiting);
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          worker?.addEventListener('statechange', () => {
            if (worker.state === 'installed') skip(worker);
          });
        });
        const check = () => registration.update().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') check();
        });
        setInterval(check, 30 * 60 * 1000);
      }).catch(() => {});
    }
  </script>
  <!-- No primeiro quadro do app, o splash some (fade de 200 ms, se já
       estava visível) e sai da página, e o service worker é registrado. -->
  <script>
    // Os textos do splash em pt-BR (o HTML vem em inglês).
    if (window.ishinydexLang === 'pt') {
      for (const element of document.querySelectorAll('[data-pt]')) {
        element.textContent = element.dataset.pt;
      }
    }
    const slowTimer = setTimeout(() => {
      document.getElementById('splash')?.classList.add('slow');
    }, 15000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(slowTimer);
      registerServiceWorker();
      const splash = document.getElementById('splash');
      if (!splash) return;
      const opacity = getComputedStyle(splash).opacity;
      if (opacity === '0') return splash.remove();
      // Congela a opacidade da animação e anima até 0.
      splash.style.animation = 'none';
      splash.style.opacity = opacity;
      splash.getBoundingClientRect();
      splash.style.transition = 'opacity 200ms ease';
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 200);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
