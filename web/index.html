<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de `--base-href` no `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Controle do PersonalDex do iShinyDex.">
  <!-- Cor da barra de status/do navegador: a do AppBar de cada tema
       (colorScheme.surface do AppTheme; conferida em test/web_index_test.dart).
       O app troca a cor quando o sistema muda de modo (Title em app.dart). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF8FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121318">
  <style>
    body { background-color: #FBF8FF; }
    @media (prefers-color-scheme: dark) { body { background-color: #121318; } }

    /* Splash do primeiro carregamento (#159). Antes do primeiro quadro o
       navegador baixa o app (main.dart.wasm, motor, catálogo) e a tela fica
       vazia. O splash já vem na página, mas invisível: só aparece se o
       carregamento passar da margem de tolerância (o atraso da animação
       splash-in). Quem abre rápido (o normal, pelo cache do service worker)
       nunca o vê. Some no primeiro quadro do Flutter (script no fim do
       body). Cores do AppTheme, conferidas em test/web_index_test.dart. */
    #splash {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px;
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      color: #1B1B21; opacity: 0;
      animation: splash-in 200ms ease 450ms forwards;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash span { font-size: 22px; font-weight: 500; }
    /* Barra indeterminada: o loader não diz quanto falta. */
    .splash-track {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      margin-top: 8px; background: #DEE0FF;
    }
    .splash-bar {
      width: 40%; height: 100%; border-radius: 2px; background: #515B92;
      animation: splash-bar 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      #splash { color: #E4E1E9; }
      .splash-track { background: #394379; }
      .splash-bar { background: #BAC3FF; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-bar { width: 100%; animation: none; opacity: 0.6; }
    }
    /* Saída de segurança (#176): sem o primeiro quadro em 15 s, o boot
       travou (um download pendurado, por exemplo); o splash explica e
       oferece recarregar. */
    .splash-slow { display: none; flex-direction: column; align-items: center;
      gap: 12px; margin-top: 8px; font-size: 14px; color: #46464F; }
    #splash .splash-slow span { font-size: 14px; font-weight: 400; }
    #splash.slow { pointer-events: auto; }
    #splash.slow .splash-slow { display: flex; }
    .splash-slow button {
      font: inherit; font-weight: 500; border: 0; border-radius: 20px;
      padding: 10px 24px; background: #515B92; color: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      .splash-slow { color: #C7C5D0; }
      .splash-slow button { background: #BAC3FF; color: #222C61; }
    }
    @keyframes splash-in { to { opacity: 1; } }
    @keyframes splash-bar {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
  </style>

  <!-- PWA no iOS: abrir em tela cheia a partir da tela de início. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default": o iOS pinta a barra com o theme-color e escolhe o texto
       que contrasta (escuro no claro, branco no escuro). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iShinyDex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iShinyDex</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <span>iShinyDex</span>
    <div class="splash-track"><div class="splash-bar"></div></div>
    <div class="splash-slow">
      <span>Está demorando mais que o normal.</span>
      <button type="button" onclick="location.reload()">Recarregar</button>
    </div>
  </div>
  <!-- Cache offline (web/sw.js): depois de um uso online, o app abre sem
       internet. Relativo ao <base href>, então vale no Pages e no Docker.
       Registrado só depois do primeiro quadro (#176): numa atualização, o
       worker novo assume a página (skipWaiting/clients.claim) e, durante o
       boot, isso pode derrubar downloads em andamento no iOS (o app ficou
       parado no splash na primeira abertura da v2.5.0). Depois do primeiro
       quadro, a troca não atrapalha. -->
  <script>
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }
  </script>
  <!-- No primeiro quadro do app, o splash some (fade de 200 ms, se já
       estava visível) e sai da página, e o service worker é registrado. -->
  <script>
    const slowTimer = setTimeout(() => {
      document.getElementById('splash')?.classList.add('slow');
    }, 15000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(slowTimer);
      registerServiceWorker();
      const splash = document.getElementById('splash');
      if (!splash) return;
      const opacity = getComputedStyle(splash).opacity;
      if (opacity === '0') return splash.remove();
      // Congela a opacidade da animação e anima até 0.
      splash.style.animation = 'none';
      splash.style.opacity = opacity;
      splash.getBoundingClientRect();
      splash.style.transition = 'opacity 200ms ease';
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 200);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
