include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Gerado pelo gen-l10n; no Flutter 3.50.0 ele ainda usa os delegates
    # deprecated do flutter_localizations (#402).
    - lib/l10n/app_localizations*.dart
    - build/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Sintaxe nova do Dart 3.13 (`new(...)`); incompatível com o estilo do freezed.
    unnecessary_type_name_in_constructor: false
    sort_pub_dependencies: false
