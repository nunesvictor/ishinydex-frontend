name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  test:
    name: Análise, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner incremental: o grafo (.dart_tool) e os arquivos gerados
      # voltam do cache, e só o que mudou é regerado. A chave muda com o
      # código; sem acerto exato, vale o cache mais recente da mesma
      # pubspec.lock (o build_runner confere tudo pelo conteúdo).
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart', 'build.yaml') }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: dart format --set-exit-if-changed lib test tool integration_test test_driver
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/check_coverage.dart
      # O build web de release fica com o job "Build web", como o do Pages.

  integration-web:
    name: Teste de integração (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner incremental: o grafo (.dart_tool) e os arquivos gerados
      # voltam do cache, e só o que mudou é regerado. A chave muda com o
      # código; sem acerto exato, vale o cache mais recente da mesma
      # pubspec.lock (o build_runner confere tudo pelo conteúdo).
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart', 'build.yaml') }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - run: flutter pub get
      - run: dart run build_runner build -d

      # O runner do Ubuntu já traz Chrome e um chromedriver compatível.
      - name: Iniciar chromedriver
        run: $CHROMEWEBDRIVER/chromedriver --port=4444 &

      - run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/app_test.dart
          -d web-server --browser-name=chrome --headless

  # O build de release do navegador, como o do GitHub Pages (modo local,
  # com wasm): pega o que só falha ao compilar para a web (código de
  # navegador, como o lib/core/web/browser_web.dart, que os testes na VM
  # não carregam).
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Mesmo cache do build_runner do job de integração.
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart', 'build.yaml') }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: >-
          flutter build web --release --wasm
          --dart-define=LOCAL_DATA=true
          --dart-define=CATALOG_URL=catalog/catalog.json
