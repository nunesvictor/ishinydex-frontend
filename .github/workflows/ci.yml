name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  test:
    name: Análise, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner incremental: o grafo (.dart_tool) e os arquivos gerados
      # voltam do cache, e só o que mudou é regerado. A chave muda com o
      # código; sem acerto exato, vale o cache mais recente da mesma
      # pubspec.lock (o build_runner confere tudo pelo conteúdo).
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart', 'build.yaml') }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: dart format --set-exit-if-changed lib test tool integration_test test_driver
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/check_coverage.dart
      # O build web de release fica com o job "Imagem Docker", que builda o
      # app (com wasm) igual ao deploy.

  integration-web:
    name: Teste de integração (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner incremental: o grafo (.dart_tool) e os arquivos gerados
      # voltam do cache, e só o que mudou é regerado. A chave muda com o
      # código; sem acerto exato, vale o cache mais recente da mesma
      # pubspec.lock (o build_runner confere tudo pelo conteúdo).
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart', 'build.yaml') }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - run: flutter pub get
      - run: dart run build_runner build -d

      # O runner do Ubuntu já traz Chrome e um chromedriver compatível.
      - name: Iniciar chromedriver
        run: $CHROMEWEBDRIVER/chromedriver --port=4444 &

      - run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/app_test.dart
          -d web-server --browser-name=chrome --headless

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ishinydex-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # O nginx precisa subir e servir o app mesmo sem backend (issue #46):
      # / responde 200 e as rotas do backend, 502.
      - name: Imagem sobe sem backend
        run: |
          docker run -d --name web -p 8090:80 -e BACKEND_URL=http://backend:8000 ishinydex-frontend:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8090/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/)" = 502
      - name: Logs do nginx
        if: failure()
        run: docker logs web
