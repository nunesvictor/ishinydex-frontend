# Imagem Docker do frontend (a mesma que o repositório principal sobe).
# Separada do CI: só roda quando muda algo que entra na imagem, e sempre na
# main. A cada bump, a "Stack completa" do ishinydex também builda a imagem.
name: Imagem Docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - web/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ishinydex-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # O nginx precisa subir e servir o app mesmo sem backend (issue #46):
      # / responde 200 e as rotas do backend, 502.
      - name: Imagem sobe sem backend
        run: |
          docker run -d --name web -p 8090:80 -e BACKEND_URL=http://backend:8000 ishinydex-frontend:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8090/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/)" = 502
      - name: Logs do nginx
        if: failure()
        run: docker logs web
