# Gera um .ipa SEM assinatura para instalar via sideload (SideStore/AltStore).
# Só manual: o PWA é o app principal; o nativo é complemento, para recursos
# que o PWA não alcança (ishinydex#50, spike frontend#418). Gera o app no modo local: o catálogo vem
# do endereço informado (o do GitHub Pages de quem publica).
name: iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      catalog_url:
        description: "Endereço do catalog.json (ex.: o catalog/catalog.json do GitHub Pages)"
        required: true
      ai_spike:
        description: "Liga o assistente de IA do spike #418 (AI_SPIKE)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  build-ipa:
    name: Build iOS sem assinatura
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build
        env:
          CATALOG_URL: ${{ inputs.catalog_url }}
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=LOCAL_DATA=true
          --dart-define=CATALOG_URL="$CATALOG_URL"
          --dart-define=AI_SPIKE=${{ inputs.ai_spike }}

      # Sem assinatura, o Xcode não grava os entitlements no binário. O ldid
      # grava (assinatura falsa); o SideStore lê dali o que pedir ao assinar
      # com o Apple ID (spike #418: os de memória do modelo).
      - name: Entitlements no binário
        run: |
          brew install ldid
          ldid -Sios/Runner/Runner.entitlements build/ios/iphoneos/Runner.app/Runner
          ldid -e build/ios/iphoneos/Runner.app/Runner

      # Um .ipa é só um zip com o Runner.app dentro de uma pasta Payload/.
      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ishinydex-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ishinydex-ipa
          path: ishinydex-unsigned.ipa
          retention-days: 30

      - name: Anexar à release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ishinydex-unsigned.ipa
