# Gera um .ipa SEM assinatura para instalar via sideload (AltStore/Sideloadly).
# Só manual: o app nativo foi descartado (ishinydex#10) e as releases com
# binários estão em ishinydex#50. Nas tags v*, falhava por falta do secret
# API_BASE_URL.
name: iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL da API (opcional; aparece nos logs públicos — prefira o secret API_BASE_URL)"
        required: false

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  build-ipa:
    name: Build iOS sem assinatura
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # Prioridade: input manual > secret API_BASE_URL.
      # O secret é mascarado nos logs (o repositório é público).
      - name: Build
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Defina o secret API_BASE_URL (ou o input api_base_url)."
            exit 1
          fi
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"

      # Um .ipa é só um zip com o Runner.app dentro de uma pasta Payload/.
      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ishinydex-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ishinydex-ipa
          path: ishinydex-unsigned.ipa
          retention-days: 30

      - name: Anexar à release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ishinydex-unsigned.ipa
