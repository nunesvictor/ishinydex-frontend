services:
  # Frontend: nginx servindo o build web do Flutter e repassando
  # /api, /media, /static e /admin para o backend (serviço `prod` do
  # ishinydex-backend, publicado na porta 8080 do host).
  #   docker compose up -d --build
  web:
    build:
      context: .
    image: ${APP_NAME:-ishinydex-frontend}:${APP_VERSION:-latest}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${X_WEB_PORT:-8090}:80"
    restart: unless-stopped
